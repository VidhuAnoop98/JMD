<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="{% static 'jquery.js' %}"></script>
    <title>Job Items</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB">
    <link rel="stylesheet" href="{% static 'core.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.7/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="{% static 'jquery.js' %}   "></script>

</head>

<body>
    <div class="container">
        <a href="#"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                class="bi bi-bank" viewBox="0 0 16 16">
                <path
                    d="m8 0 6.61 3h.89a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.5.5H15v7a.5.5 0 0 1 .485.38l.5 2a.498.498 0 0 1-.485.62H.5a.498.498 0 0 1-.485-.62l.5-2A.5.5 0 0 1 1 13V6H.5a.5.5 0 0 1-.5-.5v-2A.5.5 0 0 1 .5 3h.89zM3.777 3h8.447L8 1zM2 6v7h1V6zm2 0v7h2.5V6zm3.5 0v7h1V6zm2 0v7H12V6zM13 6v7h1V6zm2-1V4H1v1zm-.39 9H1.39l-.25 1h13.72z" />
            </svg>JMD</i></a>
        <div class="align">
            <a href="http://127.0.0.1:8000/admin/"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    fill="currentColor" class="bi bi-people" viewBox="0 0 16 16">
                    <path
                        d="M15 14s1 0 1-1-1-4-5-4-5 3-5 4 1 1 1 1zm-7.978-1L7 12.996c.001-.264.167-1.03.76-1.72C8.312 10.629 9.282 10 11 10c1.717 0 2.687.63 3.24 1.276.593.69.758 1.457.76 1.72l-.008.002-.014.002zM11 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4m3-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0M6.936 9.28a6 6 0 0 0-1.23-.247A7 7 0 0 0 5 9c-4 0-5 3-5 4q0 1 1 1h4.216A2.24 2.24 0 0 1 5 13c0-1.01.377-2.042 1.09-2.904.243-.294.526-.569.846-.816M4.92 10A5.5 5.5 0 0 0 4 13H1c0-.26.164-1.03.76-1.724.545-.636 1.492-1.256 3.16-1.275ZM1.5 5.5a3 3 0 1 1 6 0 3 3 0 0 1-6 0m3-2a2 2 0 1 0 0 4 2 2 0 0 0 0-4" />
                </svg>admin</i></a>
            <a href="#"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                    class="bi bi-box-arrow-right" viewBox="0 0 16 16">
                    <path fill-rule="evenodd"
                        d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0v2Z" />
                    <path fill-rule="evenodd"
                        d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3Z" />
                </svg>logout</a>
        </div>
    </div>
    <h1>Job Items</h1>
    {% if messages %}
    <div class="mt-3">
        {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'success' %}alert-success{% else %}alert-{{ message.tags }}{% endif %}"
            role="alert">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% if job_id %}
    <a href="{% url 'calculate' job_id=job_id %}" class="btn btn-primary"></a>
    {% endif %}
    <form method="post" action="{% url 'jobitems' job_id=job_id %}">
        {% csrf_token %}
        <div class="mb-3">
            <div class="c1">
                <h4><svg xmlns="http://www.w3.org/2000/svg" width="20" height="18" fill="currentColor" class="bi bi-box"
                        viewBox="0 0 16 16">
                        <path
                            d="M8.186 1.113a.5.5 0 0 0-.372 0L1.846 3.5 8 5.961 14.154 3.5zM15 4.239l-6.5 2.6v7.922l6.5-2.6V4.24zM7.5 14.762V6.838L1 4.239v7.923zM7.443.184a1.5 1.5 0 0 1 1.114 0l7.129 2.852A.5.5 0 0 1 16 3.5v8.662a1 1 0 0 1-.629.928l-7.185 2.874a.5.5 0 0 1-.372 0L.63 13.09a1 1 0 0 1-.63-.928V3.5a.5.5 0 0 1 .314-.464z" />
                    </svg>Job Items</h4>
            </div>
            <label for="material" class="form-label">Material </label>
            <select id="material" name="material" class="form-control">
                <option value="---">---</option>
                <option value="EXTRUSION">Aluminium Extrusion(sq.ft)</option>
                <option value="PROFILE">Aluminium Profile(kg)</option>
                <option value="SHEET">Aluminium Sheet(Nos)</option>
                <option value="ROD">Round Aluminium Rod(kg)</option>
            </select>
            <label for="length" class="form-label">Length</label>
            <input type="number" name="length" class="form-control" id="length">
            <label for="width" class="form-label">Width </label>
            <input type="number" name="width" class="form-control" id="width">
            <label for="quantity" class="form-label">Quantity</label>
            <input type="number" name="quantity" class="form-control" id="quantity">
            <label for="area" class="form-label">Area</label>
            <input type="number" name="area" class="form-control" id="area">
            <label for="anodisingtype" class="form-label">Anodising Type</label>
            <select id="anodisingtype" name="anodising_type" class="form-control">
                <option value="---">---</option>
                <option value="NATURAL">Natural/Clear(50-75)</option>
                <option value="HARD">Hard Anodising(80-120)</option>
                <option value="TYPE_II">Type II(70-100)</option>
                <option value="TYPE_III">Type III(100-150)</option>
                <option value="COLOUR">Colour Anodising(75-150)</option>
            </select>
            <label for="thickness" class="form-label">Thickness</label>
            <select id="thickness" name="thickness" class="form-control">
                <option value="---">---</option>
                <option value="5-10">Decorative(5-10μ)</option>
                <option value="15-25">Standard(15-25μ)</option>
                <option value="25-50">Industrial(25-50μ)</option>
                <option value=">50">Heavy-duty(>50μ)</option>
            </select>
            <label for="color" class="form-label">Colour/Finish</label>
            <select id="color" name="color_finish" class="form-control">
                <option value="---">---</option>
                <option value="SILVER">Silver(Base)</option>
                <option value="GOLD">Gold(Premium)</option>
                <option value="BLACK">Black(Premium)</option>
                <option value="BRONZE">Bronze(Premium)</option>
                <option value="CLEAR">Clear(Base)</option>
            </select>
            <label for="process_charges" class="form-label">Process Charges</label>
            <select id="process_charges" name="process_charges" class="form-control">
                <option value="---">---</option>
                <option value="DEGREASING">Degreasing(3-5per/sq.ft)</option>
                <option value="ETCHING">Etching(5-8per/sq.ft)</option>
                <option value="POLISHING">Polishing(8-10per/sq.ft)</option>
                <option value="SEALING">Sealing(2-4per/sq.ft)</option>
                <option value="TEFLON COATING">Teflon Coating(10-15per/sq.ft)</option>
            </select>
        </div>
        <div class="m">
            <button type="button" onclick="Back()" class="btn btn-danger">Back</button>
            <button onclick="Submit()" type="submit" id="save-btn" class="btn btn-primary">Calculate & View Bill</button>
        </div>
    </form>

    <script>
        function Back() {
            window.location.href = "{% url 'jobs' %}"
        }
    </script>

</body>

</html>
