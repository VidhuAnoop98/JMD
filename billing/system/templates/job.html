<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf_token" content="{{ csrf_token }}">
    <title>Job Details</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB">
    <link rel="stylesheet" href="{% static 'core.css' %}">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="{% static 'jquery.js' %}"></script>
</head>

<body>
    <div class="container">
        <a href="http://127.0.0.1:8000/"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                class="bi bi-bank" viewBox="0 0 16 16">
                <path
                    d="m8 0 6.61 3h.89a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.5.5H15v7a.5.5 0 0 1 .485.38l.5 2a.498.498 0 0 1-.485.62H.5a.498.498 0 0 1-.485-.62l.5-2A.5.5 0 0 1 1 13V6H.5a.5.5 0 0 1-.5-.5v-2A.5.5 0 0 1 .5 3h.89zM3.777 3h8.447L8 1zM2 6v7h1V6zm2 0v7h2.5V6zm3.5 0v7h1V6zm2 0v7H12V6zM13 6v7h1V6zm2-1V4H1v1zm-.39 9H1.39l-.25 1h13.72z" />
            </svg>JMD</i></a>
        <div class="align">
            <a href="http://127.0.0.1:8000/admin/"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    fill="currentColor" class="bi bi-people" viewBox="0 0 16 16">
                    <path
                        d="M15 14s1 0 1-1-1-4-5-4-5 3-5 4 1 1 1 1zm-7.978-1L7 12.996c.001-.264.167-1.03.76-1.72C8.312 10.629 9.282 10 11 10c1.717 0 2.687.63 3.24 1.276.593.69.758 1.457.76 1.72l-.008.002-.014.002zM11 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4m3-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0M6.936 9.28a6 6 0 0 0-1.23-.247A7 7 0 0 0 5 9c-4 0-5 3-5 4q0 1 1 1h4.216A2.24 2.24 0 0 1 5 13c0-1.01.377-2.042 1.09-2.904.243-.294.526-.569.846-.816M4.92 10A5.5 5.5 0 0 0 4 13H1c0-.26.164-1.03.76-1.724.545-.636 1.492-1.256 3.16-1.275ZM1.5 5.5a3 3 0 1 1 6 0 3 3 0 0 1-6 0m3-2a2 2 0 1 0 0 4 2 2 0 0 0 0-4" />
                </svg>admin</i></a>
            <a href="http://127.0.0.1:8000/api/"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                    class="bi bi-box-arrow-right" viewBox="0 0 16 16">
                    <path fill-rule="evenodd"
                        d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0v2Z" />
                    <path fill-rule="evenodd"
                        d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3Z" />
                </svg>logout</a>
        </div>
    </div>
    <h1>Job Details</h1>
    {% if messages %}
    <div class="mt-3">
        {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags }}{% endif %}"
            role="alert">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% if job_number %}
    <a href="{% url 'jobitems' job_id=job_number.id %}" class="btn btn-primary">Add Items</a>
    {% endif %}
    <form id="jobForm">
        {% csrf_token %}
        <div class="mb-3">
            <div class="c1">
                <h4><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-bag-fill" viewBox="0 0 16 16">
                        <path
                            d="M8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1m3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4z" />
                    </svg>Job Details</h4>
            </div>
            <label for="JobNumber" class="form-label">Job Number</label>
            <input type="text" name="job_number" class="form-control" id="JobNumber" placeholder="eg: JOB-001"
                value="{{ form.job_number|default:'' }}">
            <label for="Date" class="form-label">Date</label>
            <input type="date" name="date" class="form-control" id="Date" value="{{ form.date|default:'' }}" required>
            <label for="DueDate" class="form-label">due date</label>
            <input type="date" name="duedate" class="form-control" id="DueDate" value="{{ form.duedate|default:'' }}">
            <label for="Description" class="form-label">Description</label>
            <textarea type="text" name="descriptions" class="form-textarea" id="Descriptions"
                value="{{ form.descriptions|default:'' }}"></textarea>

        </div>
        </div>
        <div class="m">
            <button type="button" onclick="Back()" class="btn btn-secondary">Back</button>
            <button type="submit" class="btn btn-primary">Next</button>
        </div>
    </form>
    <script>
        $('#jobForm').submit(function(e) {
            e.preventDefault();
            var formData = {
                job_number: $('input[name=job_number]').val(),
                date: $('input[name=date]').val(),
                duedate: $('input[name=duedate]').val() || null,
                descriptions: $('textarea[name=descriptions]').val()
            };
            
            $.ajax({
                type: 'POST',
                url: '/api/jobs/',
                data: formData,
                headers: {
                    'X-CSRFToken': $('input[name=csrfmiddlewaretoken]').val()
                },
                success: function(response) {
                    window.location.href = "/jobs/" + response.id + "/items/";
                },
                error: function(error) {
                    alert("Error: " + JSON.stringify(error.responseJSON));
                }
            });
        });

        function Back() {
            window.location.href = "{% url 'customer' %}"
        }
    </script>
</body>

</html>
